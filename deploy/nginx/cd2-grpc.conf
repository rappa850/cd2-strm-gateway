# Native gRPC endpoint for CD2 STRM Gateway. Keep cd2.rappa.cn's
# HTTP/1.1 proxy for the CloudDrive2 web UI and gRPC-Web clients.
server {
    listen 443 ssl;
    http2 on;
    server_name cd2-grpc.rappa.cn;

    ssl_certificate     /etc/nginx/certs/_.rappa.cn.pem;
    ssl_certificate_key /etc/nginx/certs/_.rappa.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        grpc_pass grpc://127.0.0.1:19798;
        grpc_set_header Host $host;
        grpc_connect_timeout 10s;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
    }
}
